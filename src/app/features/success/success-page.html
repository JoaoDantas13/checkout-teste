<app-checkout-steps [current]="2" [completed]="true" />

@if (receipt(); as receipt) {
  <div class="mx-auto max-w-xl px-4 pt-6 sm:px-6 sm:pt-10">
    <section class="card px-5 py-8 text-center sm:px-10" aria-labelledby="success-title">
      <span class="mx-auto grid size-14 place-items-center rounded-full bg-emerald-50 text-emerald-600">
        <app-icon name="checkCircle" [size]="28" />
      </span>
      <h1 id="success-title" class="mt-4 text-2xl font-semibold tracking-tight sm:text-3xl" tabindex="-1">
        Pagamento confirmado!
      </h1>
      <p class="mx-auto mt-2 max-w-sm text-sm text-muted">
        Tudo certo, {{ firstName }}. Sua assinatura está ativa e seu espaço já está pronto para você.
      </p>
      <span class="mt-3 inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700">
        <app-icon name="check" [size]="12" [stroke]="2.6" />
        Assinatura ativa
      </span>

      <app-order-details
        class="mt-6 text-left"
        [product]="store.product"
        [rows]="rows()"
        [total]="receipt.amount"
        totalLabel="Total pago"
      />

      <p class="mt-6 text-xs text-muted">
        Enviamos o recibo para
        <span class="mt-0.5 block text-sm font-medium text-ink">{{ store.customer.email }}</span>
      </p>

      <div class="no-print mt-6 grid gap-3 sm:grid-cols-2">
        <button type="button" class="btn-primary" (click)="openWorkspace()">
          <app-icon name="arrowRight" [size]="16" />
          Acessar meu espaço
        </button>
        <button type="button" class="btn-secondary" (click)="printReceipt()">
          <app-icon name="receipt" [size]="16" />
          Ver recibo
        </button>
      </div>
    </section>

    <p class="mt-6 flex items-center justify-center gap-1.5 text-center text-xs text-muted">
      <app-icon name="calendar" [size]="14" />
      Sua próxima renovação será em {{ receipt.nextRenewal | date: 'dd/MM/yyyy' }}.
    </p>
  </div>
}
