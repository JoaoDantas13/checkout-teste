<div role="radiogroup" aria-label="Meio de pagamento" class="grid grid-cols-3 gap-2 sm:gap-3" (keydown)="onKeydown($event)">
  @for (option of options; track option.value) {
    @let active = option.value === selected();
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="active"
      [attr.tabindex]="active ? 0 : -1"
      [disabled]="disabled()"
      (click)="select(option.value)"
      class="relative flex flex-col items-start gap-2 rounded-xl border p-3 text-left transition focus-visible:outline-none focus-visible:ring-3 focus-visible:ring-brand-200 disabled:opacity-60"
      [class]="active ? 'border-brand-500 bg-brand-50 text-brand-700 ring-1 ring-brand-500' : 'border-line bg-white text-ink hover:border-brand-200'"
    >
      <app-icon [name]="option.icon" [size]="18" />
      <span class="text-sm font-medium">{{ option.label }}</span>
      <span class="hidden text-[11px] text-muted sm:block">{{ option.caption }}</span>
      <span
        class="absolute top-3 right-3 grid size-4 place-items-center rounded-full border"
        [class]="active ? 'border-brand-600 bg-brand-600' : 'border-line bg-white'"
        aria-hidden="true"
      >
        @if (active) {
          <span class="size-1.5 rounded-full bg-white"></span>
        }
      </span>
    </button>
  }
</div>
