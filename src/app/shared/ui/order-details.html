<app-product-badge [product]="product()" />
<dl class="mt-4 space-y-2.5 border-t border-line pt-4 text-sm">
  @for (row of rows(); track row.label) {
    <div class="flex items-start justify-between gap-4">
      <dt class="text-muted">{{ row.label }}</dt>
      <dd class="text-right font-medium text-ink">{{ row.value }}</dd>
    </div>
  }
</dl>
<div class="mt-4 flex items-center justify-between border-t border-line pt-4">
  <span class="text-sm font-semibold">{{ totalLabel() }}</span>
  <span class="text-xl font-bold tracking-tight">{{ total() | currency }}</span>
</div>
