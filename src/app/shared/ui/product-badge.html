<span class="grid size-11 shrink-0 place-items-center rounded-xl bg-brand-50">
  <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
    <rect x="1" y="1" width="8" height="8" rx="1.5" class="fill-brand-600" />
    <rect x="11" y="1" width="8" height="8" rx="1.5" class="fill-brand-400" />
    <rect x="1" y="11" width="8" height="8" rx="1.5" class="fill-brand-400" />
    <rect x="11" y="11" width="8" height="8" rx="1.5" class="fill-brand-600" />
  </svg>
</span>
<span class="min-w-0">
  <span class="block text-sm font-semibold text-ink">{{ product().name }}</span>
  <span class="block text-xs text-muted">{{ product().plan }}</span>
</span>
